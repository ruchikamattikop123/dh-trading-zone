.dh-app{font-family:system-ui,-apple-system,sans-serif;color:#1e293b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:24px;min-height:680px}.dh-app *{box-sizing:border-box}.dh-app h1{font-family:Georgia,serif;font-size:30px;margin:0 0 8px}.dh-app .subtitle{color:#64748b;margin:0 0 18px}.dh-app button{cursor:pointer;font:inherit}.dh-app .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}.dh-app .filter{padding:9px 14px;border:1px solid #cbd5e1;border-radius:9px;background:white}.dh-app .filter.active{background:#1e293b;color:white}.dh-app input{padding:10px;border:1px solid #cbd5e1;border-radius:9px;min-width:170px;flex:1}.dh-app .bibbtn{background:#fef3c7;border:1px solid #f59e0b;border-radius:9px;padding:10px 14px}.dh-app .map{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-bottom:18px}.dh-app .map svg{width:100%;max-height:310px}.dh-app .panel{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:17px;margin:14px 0}.dh-app .panel h2{font-family:Georgia,serif;font-size:22px;margin:0 0 12px}.dh-app .panel h3{font-size:16px}.dh-app .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.dh-app .entry{padding:10px 0;border-bottom:1px solid #e2e8f0;line-height:1.5}.dh-app .entry strong{display:block;margin-bottom:4px}.dh-app .refs{display:inline-flex;gap:5px;margin-top:5px}.dh-app .ref{font-size:12px;border:1px solid #94a3b8;border-radius:5px;background:#f1f5f9;padding:2px 6px;color:#334155}.dh-app .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.dh-app .tab{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:8px 11px}.dh-app .tab.active{background:#e0e7ff;border-color:#818cf8}.dh-app .modalback{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;z-index:999999}.dh-app .modal{background:white;color:#1e293b;max-width:720px;width:90%;max-height:80vh;overflow:auto;border-radius:16px;padding:25px;box-shadow:0 20px 80px #0004}.dh-app .close{float:right;border:0;background:#f1f5f9;padding:7px 11px;border-radius:7px}.dh-app .muted{color:#64748b}.dh-app .warning{color:#9a3412;background:#ffedd5;padding:9px;border-radius:8px}.dh-app a{color:#2563eb;overflow-wrap:anywhere}@media(max-width:700px){.dh-app .two{grid-template-columns:1fr}.dh-app{padding:12px}.dh-app h1{font-size:24px}}

.dh-app .filter,.dh-app .tab,.dh-app .bibbtn{color:#172554!important;font-weight:650}.dh-app .filter.active{background:#1e3a8a!important;color:#fff!important}.dh-app .tab.active{background:#dbeafe!important;color:#1e3a8a!important}.dh-app button:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.dh-app .ref{color:#1d4ed8!important}.dh-app #dh-search{color:#0f172a;background:#fff}.dh-app #dh-search::placeholder{color:#475569}

.dh-app .dh-node{cursor:pointer;outline:none}.dh-app .dh-node:hover{filter:drop-shadow(0 2px 5px #64748b88)}.dh-app .dh-node:focus-visible{filter:drop-shadow(0 0 5px #2563eb);outline:2px solid #2563eb}.dh-app .searchbtn{background:#1e40af;color:#fff;border:1px solid #1e40af;border-radius:9px;padding:10px 16px;font-weight:700}.dh-app .searchbtn:hover{background:#1e3a8a}.dh-app .searchclear{background:#e2e8f0;color:#0f172a;border:1px solid #94a3b8;border-radius:9px;padding:10px 12px;font-weight:600}.dh-app .searchclear:disabled{opacity:.5;cursor:not-allowed}.dh-app .result-kind{display:inline-block;color:#1e40af;font-size:12px;font-weight:700;margin-top:10px}.dh-app .dh-results>.entry{border-bottom:1px solid #cbd5e1}.dh-app .dh-results>.entry>.entry{border-bottom:0}.dh-app .toolbar input{color:#0f172a;background:white}.dh-app .toolbar input::placeholder{color:#475569;opacity:1}
</style><h1>Digital Humanities: The Interdisciplinary Trading Zone</h1><p class="subtitle">A Visual Map of Connections, Shared Uses, Critical Frictions, and Research Inquiries with 'Non-Humanities' Field</p><div class="toolbar" id="dh-toolbar"></div><div id="dh-map" class="map"></div><div id="dh-content"></div><div class="modalback" id="dh-modal"><div class="modal"><button class="close" id="dh-close">Close ✕</button><div id="dh-modal-body"></div></div></div></div>
<script>
(function(){
const D={"REFS": {"1": "Schwartz, D., & Lanphier, E. (2025). The new narrative medicine: ethical implications of artificial intelligence on healthcare narratives. Monash Bioethics Review, 44(Suppl 1), S155–S170.", "2": "Tjørring, L., Mahnke, M. S., Petersen, M. L., Nielsen, M., & Vacher, M. (2023). Productive Uneasiness as a Driver of Knowledge Creation Processes in Humanities-Business Collaborations. Journal of Business Anthropology, 12(1), 56–77.", "3": "Mandell, L., & Grumbach, E. (2015). The Business of Digital Humanities: Capitalism and Enlightenment. Scholarly and Research Communication, 6(4), 1–9.", "4": "Collins, H., Evans, R., & Gorman, M. (2007). Trading zones and interactional expertise. Studies in History and Philosophy of Science, 38(4), 657–666.", "5": "Damsholt, T., & Jespersen, A. P. (Eds.) (2016). Business Meets the Humanities: University-Industry Collaborations, Legal Hurdles, and Ethnographic Methodologies.", "6": "Luhmann, J., & Burghardt, M. (2022). Digital humanities—A discipline in its own right? An analysis of the role and position of digital humanities in the academic landscape. Journal of the Association for Information Science and Technology, 73(2), 148–171.", "7": "Corrêa Cruz, A. d. S., Alvarez, E. B., & Vital, L. P. (2022). Web application for data collection in marketing strategies: an approach from the perspective of Digital Humanities. EAI Endorsed Transactions on Scalable Information Systems, 9(5), e10.", "8": "Efthymiou, E. (2025). Integrating digital and narrative medicine in modern healthcare: a systematic review. Medical Education Online, 30(1), 2475979.", "9": "Ostherr, K. (2022). Artificial Intelligence and Medical Humanities. Journal of Medical Humanities, 43(2), 211–232.", "10": "Korn, O., Akalin, N., & Gouveia, R. (2021). Understanding Cultural Preferences for Social Robots: A Study in German and Arab Communities. ACM Transactions on Human-Robot Interaction, 10(2), 1–19.", "11": "López-Fernández, D., et al. (2025). Challenges and opportunities in the introduction of relevant content from the social sciences and humanities in engineering curricula. European Journal of Engineering Education.", "12": "Star, S. L. (2010). This is not a boundary object: Reflections on the origin of a concept. Science, Technology, & Human Values, 35(5), 601–617.", "13": "van de Ven, I., & van Nuenen, T. (2022). Digital hermeneutics: scaled readings of online depression discourses. Medical Humanities, 48(3), 335–346.", "14": "Klein, L. F., & Gold, M. K. (2016). Digital Humanities: The Expanded Field. Debates in the Digital Humanities 2016.", "15": "Koenecke, A., Nam, A., Lake, E., Nudell, J., Quartey, M., Mengesha, Z., ... & Goel, S. (2020). Racial disparities in automated speech recognition. PNAS, 117(14), 7684–7689.", "16": "Ryynänen, T., & Hyyryläinen, T. (2018). Digitalisation of Consumption and Digital Humanities - Development Trajectories and Challenges for the Future. CEUR Workshop Proceedings, Vol. 2084.", "17": "Student Commonplace Book (2024). Critical Reflections on Digital Infrastructures, Algorithmic Power, and Collaborative Trading Zones in the Digital Humanities.", "18": "Czerwionka, L., et al. (2025). Developing students' sociotechnical thinking in the humanities‐engineering classroom: A treatment versus control study using a scenario‐based assessment. Journal of Engineering Education, 114(3), e70004.", "19": "Obermeyer, Z., Powers, B., Vogeli, C., & Mullainathan, S. (2019). Dissecting racial bias in an algorithm used to manage the health of populations. Science, 366(6464), 447–453.", "20": "Ferdman, A., & Ratti, E. (2024). What Do We Teach to Engineering Students: Embedded Ethics, Morality, and Politics. Science and Engineering Ethics, 30(1), 7."}, "VERIFY": {"2": "DOI omitted in supplied revision; source details need checking.", "3": "No direct link supplied.", "4": "No direct link supplied.", "5": "No publisher or direct link supplied.", "7": "DOI omitted in supplied revision.", "12": "DOI omitted in supplied revision.", "16": "No direct link supplied.", "17": "Local notebook source; not a published article."}, "LINKS": {"1": "https://doi.org/10.1007/s40592-025-00256-z", "6": "https://doi.org/10.1002/asi.24533", "8": "https://doi.org/10.1080/10872981.2025.2475979", "9": "https://doi.org/10.1007/s10912-020-09636-4", "10": "https://doi.org/10.1145/3439717", "11": "https://doi.org/10.1080/03043797.2025.2610703", "13": "https://doi.org/10.1136/medhum-2020-012104", "14": "https://dhdebates.gc.cuny.edu/read/65be1a40-6473-4d9e-ba75-6380e5a72138/section/14b686b2-bdda-417f-b603-96ae8fbbfd0f", "15": "https://doi.org/10.1073/pnas.1915768117", "18": "https://doi.org/10.1002/jee.70004", "19": "https://doi.org/10.1126/science.aax2342", "20": "https://doi.org/10.1007/s11948-024-00469-1"}, "HUB": {"color": "#b45309", "items": [["Core concept", "Digital Humanities uses digital methods to explore questions about people, culture, and society, while critically examining how these tools shape what we can understand.", [4, 12]], ["Dual identity", "DH combines computational tools (data mining, text analysis, web mapping) with humanistic thinking that questions context, ethics, and power.", [6, 14]]]}, "DISC": {"Business": {"color": "#059669", "tint": "#ecfdf5", "sub": "Market Strategy, Consumption, and Public Concern", "for_field": [["Focusing on real human needs", "Helps companies design products around real human habits and social concerns, like sustainability, rather than just pushing tech features. Example: in “Eat it, and save it,” researchers visited family kitchens to understand cooking routines and support sustainable food offerings.", [5, 2]], ["Testing designs with real people", "Uses hands-on, human-centered testing to see how people interact with spaces before they are built. Example: an architecture firm built a moveable, full-scale room prototype in an unused construction building so future residents could test apartment layouts.", [5, 2]]], "for_dh": [["Saving history on digital servers", "Commercial partnerships can help pay for scanning, storing, and maintaining historical collections. Example: Gale Cengage and researchers digitized eighteenth-century books for ECCO; commercial access and text correction also raise questions about ownership.", [3]]], "critique": [["Profit vs. public good", "Businesses may collect data to increase profit, while critical DH asks who benefits and whose rights are protected.", [16, 14]], ["Over-collecting data and digital resignation", "Apps may offer benefits in exchange for personal data, while users rarely read lengthy privacy terms.", [16, 7]], ["Workplace culture clashes", "Corporate workshops may demand short sticky-note answers, leaving less room for the depth of humanistic analysis.", [2]], ["Paywalls on public history", "Commercial digitization can place historical materials behind paywalls, limiting access to shared cultural heritage.", [3]]], "questions": [["When researchers clean digitized historical texts for companies, are they democratizing public history or giving free labor to private corporations?", [3]], ["How can scholars stay independent when university funding requires immediate financial value for businesses?", [2]], ["Does calling consumers “co-creators” empower people, or make it easier to track and profit from them?", [16]], ["How can university–business contracts protect open research instead of locking ideas behind corporate secrecy?", [5]]]}, "Engineering": {"color": "#4338ca", "tint": "#eef2ff", "sub": "Sociotechnical Systems, Ethics, and Design", "for_field": [["Thinking about people and society", "Humanities-informed engineering teaches that habits, local cultures, and public well-being are part of technical problem-solving. Example: a study reported stronger sociotechnical thinking among students in integrated humanities–engineering classes.", [18]], ["Robots that fit local cultures", "Cultural insight helps engineers design social robots sensitive to local norms of politeness and appearance. Example: cross-cultural work involving German and Arab communities examined differences in social robot preferences.", [10]], ["Auditing AI bias", "Language and social analysis can reveal demographic disparities in AI. Example: a study of major commercial speech recognition systems found substantially higher error rates for Black speakers.", [15]]], "for_dh": [["Powerful computing tools", "Engineering offers computational infrastructure for large-scale text analysis and topic modeling. The supplied revision mentions mapping decades of academic journals, but does not identify a specific source for that example.", [6]]], "critique": [["Focusing only on speed and efficiency", "Technical optimization can overshadow the effects of technology on human lives.", [20]], ["School and faculty resistance", "Humanities content may be treated as optional rather than essential in engineering curricula.", [11]], ["The myth of neutral technology", "Mathematical models can encode assumptions and historical bias rather than being value-free.", [15, 20]], ["Simplifying human culture", "Nuanced human behavior can be flattened into numerical variables or flowcharts.", [12, 4]]], "questions": [["Does adding ethics classes build real responsibility, or just tick an accreditation box?", [20]], ["How can digital humanists use computing without assuming numbers tell the whole truth?", [6]], ["What rules should make tech companies disclose where AI training data comes from?", [15]], ["How can universities break down the wall between “hard tech” and “soft human studies”?", [11]]]}, "Medicine": {"color": "#be123c", "tint": "#fff1f2", "sub": "Narrative Medicine, Hermeneutics, and Clinical Data", "for_field": [["Guiding AI in healthcare", "Humanistic approaches can help doctors critically review AI-generated clinical notes. Example: DAX Copilot drafts notes from patient encounters, leaving clinicians responsible for accuracy and patient meaning.", [1]], ["Understanding health discussions online", "Combines large-scale text analysis and close reading to understand how people describe distress in forums. Example: research into Reddit depression discussions shows narratives that may not fit standardized clinical forms.", [13]], ["Spotting flaws in health software", "Critical analysis can test whether health algorithms treat groups fairly. Example: an influential audit showed how healthcare spending used as a proxy for medical need disadvantaged Black patients.", [19]]], "for_dh": [["High-stakes ethical grounding", "Clinical contexts give humanistic questions about storytelling, empathy, and dignity practical importance. The supplied example claims that narrative programs improve patient trust; that outcome should be checked against specific evidence.", [8, 1]]], "critique": [["From caring doctors to computer editors", "AI-drafted notes could reduce documentation work but also change how clinicians listen and interpret patients.", [1]], ["Private health data mining", "Health-related activity and online discussion may be repurposed for profiling without clear consent.", [9]], ["Using dollars to measure illness", "Medical expenditure is an unreliable stand-in for illness severity when access to care is unequal.", [19]], ["Forcing patient stories into rigid boxes", "Structured clinical forms can miss the nonlinear nature of lived illness.", [13, 8]]], "questions": [["Does AI chart-writing save doctors time, or weaken the personal bond with patients?", [1]], ["How can hospitals analyze health forums while respecting user privacy?", [13]], ["When AI uses medical costs to allocate extra care, how can hidden racial bias be corrected?", [19]], ["How can health software preserve patient stories alongside standardized forms?", [8]]]}}, "TRANS": [["Business ↔ Engineering", "Data Capitalism & Software Architecture", "Market incentives influence how software systems collect, monetize, and govern data.", [16, 20]], ["Engineering ↔ Medicine", "Diagnostic AI & Healthcare Robotics", "Technical performance and clinical decision-making must be considered alongside patient-centered ethics.", [19, 1]], ["Medicine ↔ Business", "Marketization of Care vs. Patient Autonomy", "Cost containment and commercial priorities may conflict with the patient’s autonomy and dignity.", [19, 9]]]},root=document.getElementById('dh-app'),toolbar=root.querySelector('#dh-toolbar'),content=root.querySelector('#dh-content'),map=root.querySelector('#dh-map'),modal=root.querySelector('#dh-modal'),modalBody=root.querySelector('#dh-modal-body');let focus='All Fields',term='',tabs={},searchQuery='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const refs=rr=>'<span class="refs">'+rr.map(n=>'<button class="ref" data-ref="'+n+'">['+n+']</button>').join('')+'</span>';
const entry=(title,desc,rr)=>'<div class="entry"><strong>'+esc(title)+'</strong>'+esc(desc)+'<div>'+refs(rr)+'</div></div>';
const items=arr=>arr.map(x=>entry(x[0],x[1],x[2])).join('');
function drawMap(){
  // Edit these coordinates to reposition the four nodes.
  const pts={Business:[135,258],Engineering:[380,53],Medicine:[625,258],DH:[380,183]};
  const hubRadius=69, boxHalfWidth=91, boxHalfHeight=28;
  // Clip every line to the actual edge of the circle / rounded rectangle.
  function edge(from,to,kind){
    const dx=to[0]-from[0],dy=to[1]-from[1],dist=Math.hypot(dx,dy)||1;
    const ux=dx/dist,uy=dy/dist;
    const offset=kind==='circle'?hubRadius:Math.min(
      Math.abs(ux)<1e-6?Infinity:boxHalfWidth/Math.abs(ux),
      Math.abs(uy)<1e-6?Infinity:boxHalfHeight/Math.abs(uy));
    return [from[0]+ux*offset,from[1]+uy*offset];
  }
  function line(a,b,color,opacity,dashed){
    const p=edge(pts[a],pts[b],a==='DH'?'circle':'box');
    const q=edge(pts[b],pts[a],b==='DH'?'circle':'box');
    return '<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" '+(dashed?'stroke-dasharray="6 7" ':'')+'opacity="'+opacity+'"/>';
  }
  let lines='';
  for(const name of Object.keys(D.DISC)){
    lines+=line('DH',name,D.DISC[name].color,focus==='All Fields'||focus===name?1:.18,false);
  }
  for(const [a,b] of [['Business','Engineering'],['Engineering','Medicine'],['Medicine','Business']]){
    lines+=line(a,b,'#94a3b8',focus==='Transversal Connections'||focus==='All Fields'?.8:.12,true);
  }
  let nodes='';
  for(const [name,c] of Object.entries(D.DISC)){
    const p=pts[name];
    nodes+='<g class="dh-node" role="button" tabindex="0" aria-label="Filter to '+name+'" data-map-focus="'+name+'" opacity="'+(focus==='All Fields'||focus===name?1:.35)+'"><rect x="'+(p[0]-boxHalfWidth)+'" y="'+(p[1]-boxHalfHeight)+'" width="'+(boxHalfWidth*2)+'" height="'+(boxHalfHeight*2)+'" rx="12" fill="'+c.tint+'" stroke="'+c.color+'" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="16" font-weight="650" fill="'+c.color+'">'+name+'</text></g>';
  }
  // Three centered lines instead of one long label: every line fits the hub circle.
  nodes+='<g class="dh-node" role="button" tabindex="0" aria-label="Show all fields" data-map-focus="All Fields"><circle cx="380" cy="183" r="'+hubRadius+'" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>'
    +'<g text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif">'
    +'<text x="380" y="169" font-size="15" font-weight="700">Digital</text>'
    +'<text x="380" y="188" font-size="15" font-weight="700">Humanities</text>'
    +'<text x="380" y="209" font-size="11.5" font-weight="550">Trading Zone Core</text></g></g>';
  map.innerHTML='<svg viewBox="0 0 760 310" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Digital Humanities trading zone map, with connectors ending at node boundaries">'+lines+nodes+'</svg>';
}
function render(){toolbar.innerHTML=['All Fields','Business','Engineering','Medicine','Transversal Connections'].map(x=>'<button class="filter '+(focus===x?'active':'')+'" data-focus="'+x+'">'+x+'</button>').join('')+'<input id="dh-search" placeholder="Search research content…" value="'+esc(term)+'"/><button class="bibbtn" id="dh-bib">📚 Full Academic References (20)</button>';drawMap();let out='';if(focus==='All Fields'){out+='<section class="panel"><h2>Digital Humanities: Trading Zone Core</h2>'+items(D.HUB.items)+'</section>';}for(const [name,c] of Object.entries(D.DISC)){if(focus!=='All Fields'&&focus!==name)continue;let tab=tabs[name]||'A';let body=tab==='A'?'<div class="two"><div><h3>What '+name+' gains from DH</h3>'+items(c.for_field)+'</div><div><h3>What DH gains from '+name+'</h3>'+items(c.for_dh)+'</div></div>':tab==='B'?items(c.critique):c.questions.map((q,i)=>entry('Question '+(i+1),q[0],q[1])).join('');out+='<section class="panel" data-discipline="'+name+'" style="border-top:4px solid '+c.color+'"><h2>DH ↔ '+name+'</h2><p class="muted">'+esc(c.sub)+'</p><div class="tabs">'+[['A','A. Mutual Usefulness & Examples'],['B','B. Critical Interventions'],['C','C. Critical Questions']].map(([k,l])=>'<button class="tab '+(tab===k?'active':'')+'" data-tab="'+name+':'+k+'">'+l+'</button>').join('')+'</div>'+body+'</section>';}
if(focus==='All Fields'||focus==='Transversal Connections'){out+='<section class="panel"><h2>Transversal intersections</h2>'+D.TRANS.map(t=>entry(t[0]+' — '+t[1],t[2],t[3])).join('')+'</section>';}
content.innerHTML=out;
if(searchQuery){
  const q=searchQuery.toLocaleLowerCase();
  const hits=[];
  const test=(name,kind,title,desc,rr)=>{
    const citationText=(rr||[]).map(id=>D.REFS[id]||'').join(' ');
    if([name,kind,title,desc,citationText].join(' ').toLocaleLowerCase().includes(q))hits.push({name,kind,title,desc,rr});
  };
  for(const x of D.HUB.items)test('Digital Humanities','Core concept',x[0],x[1],x[2]);
  for(const [name,c] of Object.entries(D.DISC)){
    for(const [key,label] of [['for_field','What '+name+' gains from DH'],['for_dh','What DH gains from '+name],['critique','Critical interventions'],['questions','Critical questions']]){
      for(const x of c[key])test(name,label,x[0],x[1],x[2]);
    }
  }
  for(const x of D.TRANS)test('Transversal Connections','Interdisciplinary connection',x[0]+' — '+x[1],x[2],x[3]);
  for(const [id,reference] of Object.entries(D.REFS)){
    if(reference.toLocaleLowerCase().includes(q) || id===searchQuery.trim()){
      hits.push({name:'Bibliography',kind:'Reference ['+id+']',title:reference,desc:'',rr:[Number(id)]});
    }
  }
  const shown=hits.filter(x=>focus==='All Fields'||focus===x.name||(focus==='Transversal Connections'&&x.name==='Transversal Connections'));
  content.innerHTML='<section class="panel dh-results" aria-live="polite"><h2>Search results for “'+esc(searchQuery)+'”</h2><p class="muted">'+shown.length+' matching entries'+(focus!=='All Fields'?' in '+esc(focus):' across all disciplines and references')+'. Search checks titles, descriptions, questions, and cited paper titles.</p>'+(shown.length?shown.map(x=>'<div class="entry"><span class="result-kind">'+esc(x.name)+' · '+esc(x.kind)+'</span>'+entry(x.title,x.desc,x.rr||[])+'</div>').join(''):'<p>No matches. Try a broader term, or choose All Fields.</p>')+'</section>';
}
}
function runSearch(){const input=root.querySelector('#dh-search');term=input?input.value.trim():term;searchQuery=term;render();}
function showRef(n){const r=D.REFS[n],warn=D.VERIFY[n],url=D.LINKS&&D.LINKS[n];let link=url?'<p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open source / DOI ↗</a></p><p class="muted">Link supplied in the revised brief; verify before citing.</p>':'<p class="muted">Direct link not available in the supplied material.</p>';modalBody.innerHTML='<h2>Reference ['+n+']</h2><p>'+esc(r)+'</p>'+(warn?'<p class="warning">'+esc(warn)+'</p>':'')+link+'<p class="muted">Abstract summary not provided; no abstract has been invented.</p>';modal.style.display='flex';}
function showBib(){modalBody.innerHTML='<h2>Scholarly bibliography</h2><p class="muted">20 references supplied in the revised brief. Publication details and links require independent verification.</p>'+Object.entries(D.REFS).map(([n,r])=>'<div class="entry"><button class="ref" data-ref="'+n+'">['+n+']</button> '+esc(r)+(D.VERIFY[n]?'<p class="warning">'+esc(D.VERIFY[n])+'</p>':'')+'</div>').join('');modal.style.display='flex';}
root.addEventListener('click',e=>{const mapNode=e.target.closest('[data-map-focus]');if(mapNode){focus=mapNode.dataset.mapFocus;searchQuery='';term='';render();return;}let b=e.target.closest('button');if(!b)return;if(b.id==='dh-search-btn'){runSearch();return;}if(b.id==='dh-search-clear'){term='';searchQuery='';render();return;}if(b.dataset.focus){focus=b.dataset.focus;render();}else if(b.dataset.tab){let [name,tab]=b.dataset.tab.split(':');tabs[name]=tab;render();}else if(b.dataset.ref){showRef(b.dataset.ref);}else if(b.id==='dh-bib'){showBib();}else if(b.id==='dh-close'){modal.style.display='none';}});root.addEventListener('input',e=>{if(e.target.id==='dh-search')term=e.target.value;});
root.addEventListener('keydown',e=>{
  if(e.target.id==='dh-search'&&e.key==='Enter'){e.preventDefault();runSearch();}
  const mapNode=e.target.closest('[data-map-focus]');
  if(mapNode&&(e.key==='Enter'||e.key===' ')){e.preventDefault();focus=mapNode.dataset.mapFocus;searchQuery='';term='';render();}
});
modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none';});render();
})();
</script></body></html>
